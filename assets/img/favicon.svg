<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8e8ff"/>
      <stop offset="45%" stop-color="#28d8f0"/>
      <stop offset="100%" stop-color="#70b8f8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="10" fill="#04101e"/>
  <rect width="64" height="64" rx="10" fill="none" stroke="rgba(40,120,200,0.25)" stroke-width="1"/>
  <text x="32" y="44" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="26" letter-spacing="2" text-anchor="middle" fill="url(#g)" filter="url(#glow)">AS</text>
</svg>
