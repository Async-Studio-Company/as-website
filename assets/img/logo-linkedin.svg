<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#060f1e"/>
      <stop offset="100%" stop-color="#030c18"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e5ab8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e5ab8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20d8e8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#20d8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a3878" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a3878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wm" x1="50" y1="100" x2="450" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c8e8ff"/>
      <stop offset="35%" stop-color="#70b8f8"/>
      <stop offset="75%" stop-color="#28d8f0"/>
      <stop offset="100%" stop-color="#80c8ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.08  0 0 0 0 0.47  0 0 0 0 0.9  0 0 0 0.5 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <ellipse cx="100" cy="130" rx="220" ry="180" fill="url(#orb1)"/>
  <ellipse cx="420" cy="390" rx="200" ry="160" fill="url(#orb3)"/>
  <ellipse cx="320" cy="100" rx="140" ry="110" fill="url(#orb2)"/>

  <!-- "AS" monogram — large, dominant -->
  <text x="250" y="290"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="210"
    letter-spacing="-4"
    text-anchor="middle"
    fill="url(#wm)"
    filter="url(#glow)">AS</text>

  <!-- Wordmark below -->
  <text x="250" y="378"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="36"
    letter-spacing="12"
    text-anchor="middle"
    fill="url(#wm)"
    opacity="0.82">ASYNC</text>

  <text x="250" y="420"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="36"
    letter-spacing="8"
    text-anchor="middle"
    fill="url(#wm)"
    opacity="0.65">STUDIO</text>
</svg>
